name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For larger features, please discuss the direction here before sending a PR — the project's scope is intentionally narrow and feature additions benefit from a design conversation up front.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user-facing situation, not the implementation.
      placeholder: |
        When I put on the same album twice in a week, I have no way to see how often I've played it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: Rough sketch of what you have in mind. Doesn't need to be specific.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways this could be solved, and why your proposal is better.
    validations:
      required: false
