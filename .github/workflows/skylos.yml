name: Skylos Analysis

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  skylos:
    name: Skylos Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install pi project dependencies
        working-directory: pi
        run: uv sync --all-extras

      - name: Install Skylos
        run: python -m pip install skylos==4.14.0

      - name: Run Skylos Analysis
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/pi/.venv
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            skylos pi --danger --quality --secrets --baseline --diff-base "origin/${BASE_REF}" --diff "origin/${BASE_REF}" --json -o skylos-results.json
          else
            skylos pi --danger --quality --secrets --baseline --json -o skylos-results.json
          fi

      - name: Quality Gate
        if: always()
        run: skylos cicd gate --input skylos-results.json --summary --advisory

      - name: GitHub Annotations
        if: always()
        run: skylos cicd annotate --input skylos-results.json

      - name: PR Review Comments
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: skylos cicd review --input skylos-results.json --diff-base "origin/${BASE_REF}" --evidence-cards
